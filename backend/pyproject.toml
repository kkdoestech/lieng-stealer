# Tool configuration for the backend. Dependencies live in requirements*.txt.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "app.py"]

[[tool.mypy.overrides]]
# flask-cors ships no type information.
module = ["flask_cors"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
